<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="5">
<title>Product landscape</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>mermaid.initialize({ startOnLoad: true, theme: "neutral" });</script>
<style>
/* Full-window canvas; the diagram pans and zooms inside it, controls float bottom-right. */
:root {
  --bg: #f6f8f7; --surface: #ffffff; --fg: #1c2624; --muted: #5d6b68; --line: #d6dedb; --accent: #1f7a6b;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121816; --surface: #1a2220; --fg: #e3ebe8; --muted: #9aa8a4; --line: #2c3835; --accent: #4fb8a4; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121816; --surface: #1a2220; --fg: #e3ebe8; --muted: #9aa8a4; --line: #2c3835; --accent: #4fb8a4; color-scheme: dark }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); overflow: hidden; }
#viewport { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
#viewport.dragging { cursor: grabbing; }
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#stage pre.mermaid { margin: 0; background: transparent; }
#stage svg { max-width: none !important; display: block; }
.badge { position: fixed; left: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); font-family: var(--mono); font-size: 12px;
  letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; pointer-events: none; }
.legend { position: fixed; right: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); font-size: 12px; color: var(--muted);
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; pointer-events: none; }
.legend span { display: block; }
.controls { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
.controls button { font: 600 15px var(--sans); min-width: 38px; height: 34px; padding: 0 10px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
.controls button:hover { border-color: var(--accent); }
.controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#zoomlabel { font: 12px var(--mono); color: var(--muted); align-self: center; min-width: 48px; text-align: center; }
.hint { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: var(--muted); }
@media (max-width: 520px) { .hint, .legend { display: none; } }
</style></head><body>
<div id="viewport"><div id="stage"><pre class="mermaid">
%%MERMAID%%
</pre></div></div>
<div class="badge">Product landscape · %%VERSION%%</div>
<div class="legend"><span>Green border: ours</span><span>Grey: external</span><span>Orange: shared / unclear</span><span>Dashed box: planned or not yet in use</span><span>Red: gap</span><span>Dotted arrow: not yet confirmed</span></div>
<div class="hint">Drag to pan · scroll or pinch to zoom · F to fit</div>
<div class="controls">
  <button id="zout" aria-label="Zoom out">−</button>
  <span id="zoomlabel">100%</span>
  <button id="zin" aria-label="Zoom in">+</button>
  <button id="fit">Fit</button>
  <button id="one">1:1</button>
</div>
<script>
(function () {
  const vp = document.getElementById('viewport'), stage = document.getElementById('stage'), label = document.getElementById('zoomlabel');
  let s = 1, x = 0, y = 0, fitted = false;
  const apply = () => { stage.style.transform = `translate(${x}px, ${y}px) scale(${s})`; label.textContent = Math.round(s * 100) + '%'; };
  const size = () => { const svg = stage.querySelector('svg'); if (!svg) return null; const r = svg.getBoundingClientRect(); return { w: r.width / s, h: r.height / s }; };
  const fit = () => { const d = size(); if (!d || !d.w) return false; const W = vp.clientWidth, H = vp.clientHeight;
    s = Math.min(W / d.w, (H - 60) / d.h) * 0.95; x = (W - d.w * s) / 2; y = (H - d.h * s) / 2 + 10; apply(); return true; };
  const zoomAt = (f, cx, cy) => { const ns = Math.min(8, Math.max(0.1, s * f)); x = cx - (cx - x) * ns / s; y = cy - (cy - y) * ns / s; s = ns; apply(); };
  const center = () => [vp.clientWidth / 2, vp.clientHeight / 2];
  document.getElementById('zin').onclick = () => zoomAt(1.25, ...center());
  document.getElementById('zout').onclick = () => zoomAt(0.8, ...center());
  document.getElementById('fit').onclick = fit;
  document.getElementById('one').onclick = () => { const [cx, cy] = center(); zoomAt(1 / s, cx, cy); };
  vp.addEventListener('wheel', e => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY); }, { passive: false });
  const pts = new Map(); let last = null, pinch = null;
  vp.addEventListener('pointerdown', e => { vp.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); vp.classList.add('dragging');
    if (pts.size === 1) last = [e.clientX, e.clientY]; if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); } });
  vp.addEventListener('pointermove', e => { if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2 && pinch) { const [a, b] = [...pts.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); zoomAt(d / pinch, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); pinch = d; }
    else if (pts.size === 1 && last) { x += e.clientX - last[0]; y += e.clientY - last[1]; last = [e.clientX, e.clientY]; apply(); } });
  const up = e => { pts.delete(e.pointerId); pinch = null; last = pts.size === 1 ? [...pts.values()][0] : null; if (!pts.size) vp.classList.remove('dragging'); };
  vp.addEventListener('pointerup', up); vp.addEventListener('pointercancel', up);
  document.addEventListener('keydown', e => { if (e.key === '+' || e.key === '=') zoomAt(1.25, ...center());
    else if (e.key === '-') zoomAt(0.8, ...center()); else if (e.key === 'f' || e.key === 'F') fit(); });
  const tryFit = () => { if (!fitted && fit()) fitted = true; };
  new MutationObserver(tryFit).observe(stage, { childList: true, subtree: true });
  window.addEventListener('resize', () => fitted && fit());
  let n = 0; const poll = setInterval(() => { tryFit(); if (fitted || ++n > 50) clearInterval(poll); }, 100);
  apply();
})();
</script>
</body></html>
